name: build

# Pull requests build every image without pushing. A push to main (or a manual
# run) builds and pushes ghcr.io/kurtyoon/yatai-arm64/<image>:<tag> and
# <tag>-<commit>, so deployments can pin an image that later builds leave alone.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
      - name: metrics-transformer tests
        working-directory: images/metrics-transformer
        run: |
          test -z "$(gofmt -l .)"
          go vet ./...
          go test ./...

  build:
    needs: test
    runs-on: ubuntu-24.04-arm
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: yatai
            tag: 1.1.13
          - image: yatai-deployment
            tag: 1.1.21
          - image: yatai-image-builder
            tag: 1.2.56
          - image: bento-downloader
            tag: 0.0.5
          - image: bentoml-proxy
            tag: 0.0.1
          - image: metrics-transformer
            tag: 0.1.0
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: image name
        id: name
        run: |
          echo "ref=ghcr.io/${GITHUB_REPOSITORY,,}/${{ matrix.image }}" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: images/${{ matrix.image }}
          platforms: linux/arm64
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.name.outputs.ref }}:${{ matrix.tag }}
            ${{ steps.name.outputs.ref }}:${{ matrix.tag }}-${{ steps.name.outputs.short }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ matrix.tag }}
